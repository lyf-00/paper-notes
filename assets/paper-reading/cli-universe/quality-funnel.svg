<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">CLI-Universe 的质量漏斗</title>
  <desc id="desc">从能力组合、证据研究、环境实现、测试与解答隔离到可执行过滤，候选任务逐步收缩为高信息密度训练轨迹。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#163966" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="70" y="76" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#102a43">CLI-Universe：把“生成更多”改造成“验证后再训练”</text>
  <text x="70" y="116" font-family="Arial, sans-serif" font-size="19" fill="#486581">核心资产不是任务数量，而是带真实环境、可执行判据和成功轨迹的高密度监督信号</text>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(70 170)">
      <rect width="190" height="230" rx="20" fill="#fff" stroke="#9fb3c8"/>
      <circle cx="95" cy="56" r="31" fill="#d9e8ff"/>
      <text x="95" y="64" text-anchor="middle" font-size="25" font-weight="700" fill="#1f5fae">1</text>
      <text x="95" y="116" text-anchor="middle" font-size="22" font-weight="700" fill="#102a43">能力锚点</text>
      <text x="95" y="154" text-anchor="middle" font-size="17" fill="#486581">Domain × Skill</text>
      <text x="95" y="182" text-anchor="middle" font-size="17" fill="#486581">Capability × Pillar</text>
    </g>
    <g transform="translate(290 170)">
      <rect width="190" height="230" rx="20" fill="#fff" stroke="#9fb3c8"/>
      <circle cx="95" cy="56" r="31" fill="#dff4e5"/>
      <text x="95" y="64" text-anchor="middle" font-size="25" font-weight="700" fill="#257a3e">2</text>
      <text x="95" y="116" text-anchor="middle" font-size="22" font-weight="700" fill="#102a43">证据研究</text>
      <text x="95" y="154" text-anchor="middle" font-size="17" fill="#486581">仓库、文档、Issue</text>
      <text x="95" y="182" text-anchor="middle" font-size="17" fill="#486581">约束与失败模式</text>
    </g>
    <g transform="translate(510 170)">
      <rect width="190" height="230" rx="20" fill="#fff" stroke="#9fb3c8"/>
      <circle cx="95" cy="56" r="31" fill="#fff0cc"/>
      <text x="95" y="64" text-anchor="middle" font-size="25" font-weight="700" fill="#9a6700">3</text>
      <text x="95" y="116" text-anchor="middle" font-size="22" font-weight="700" fill="#102a43">环境实现</text>
      <text x="95" y="154" text-anchor="middle" font-size="17" fill="#486581">Docker + 固定依赖</text>
      <text x="95" y="182" text-anchor="middle" font-size="17" fill="#486581">素材与运行状态</text>
    </g>
    <g transform="translate(730 170)">
      <rect width="190" height="230" rx="20" fill="#fff" stroke="#9fb3c8"/>
      <circle cx="95" cy="56" r="31" fill="#f4e4ff"/>
      <text x="95" y="64" text-anchor="middle" font-size="25" font-weight="700" fill="#7650a8">4</text>
      <text x="95" y="116" text-anchor="middle" font-size="22" font-weight="700" fill="#102a43">隔离构造</text>
      <text x="95" y="154" text-anchor="middle" font-size="17" fill="#486581">Test Agent</text>
      <text x="95" y="182" text-anchor="middle" font-size="17" fill="#486581">Solution Agent</text>
    </g>
    <g transform="translate(950 170)">
      <rect width="180" height="230" rx="20" fill="#173f73" stroke="#173f73"/>
      <circle cx="90" cy="56" r="31" fill="#fff"/>
      <text x="90" y="64" text-anchor="middle" font-size="25" font-weight="700" fill="#173f73">5</text>
      <text x="90" y="116" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">可执行过滤</text>
      <text x="90" y="154" text-anchor="middle" font-size="17" fill="#d9e8ff">Hint 必要性</text>
      <text x="90" y="182" text-anchor="middle" font-size="17" fill="#d9e8ff">Fail-to-pass</text>
    </g>
  </g>
  <g stroke="#5c7c9e" stroke-width="4" fill="none">
    <path d="M260 285h24"/><path d="m276 275 12 10-12 10"/>
    <path d="M480 285h24"/><path d="m496 275 12 10-12 10"/>
    <path d="M700 285h24"/><path d="m716 275 12 10-12 10"/>
    <path d="M920 285h24"/><path d="m936 275 12 10-12 10"/>
  </g>
  <rect x="120" y="460" width="960" height="88" rx="18" fill="#fff" stroke="#b8c7d9"/>
  <text x="160" y="498" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#102a43">100% 候选</text>
  <path d="M300 493h580" stroke="#d4deea" stroke-width="14" stroke-linecap="round"/>
  <path d="M300 493h195" stroke="#2f75b5" stroke-width="14" stroke-linecap="round"/>
  <circle cx="495" cy="493" r="12" fill="#2f75b5"/>
  <text x="460" y="531" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2f75b5">33.6% 留存</text>
  <text x="900" y="498" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#173f73">6K 成功轨迹</text>
</svg>
