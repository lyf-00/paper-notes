<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">LLM Agent Harness 2019 到 2026 演进时间线</title>
  <desc id="desc">从单轮提示、ReAct、Agent Framework、Agent Runtime、持久个人 Agent 到 Harness Engineering 的六个阶段。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#edf4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#173f73" flood-opacity=".11"/>
    </filter>
  </defs>
  <rect width="1440" height="760" rx="32" fill="url(#bg)"/>
  <text x="72" y="72" font-family="Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="38" font-weight="750" fill="#102a43">从“写好一句话”到“设计整个执行系统”</text>
  <text x="72" y="112" font-family="Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#486581">阶段会重叠：新范式不是替代旧范式，而是把工程对象从 prompt 逐步扩大到 context、loop、runtime 与 governance</text>
  <line x1="112" y1="374" x2="1328" y2="374" stroke="#91a9c4" stroke-width="8" stroke-linecap="round"/>

  <g font-family="Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif" filter="url(#shadow)">
    <g transform="translate(72 166)">
      <rect width="205" height="158" rx="20" fill="#ffffff" stroke="#b8c9dd"/>
      <text x="24" y="35" font-size="16" font-weight="700" fill="#627d98">ERA 0 · 2019–2022</text>
      <text x="24" y="73" font-size="23" font-weight="750" fill="#174f8a">Prompt Engineering</text>
      <text x="24" y="108" font-size="17" fill="#486581">input → output</text>
      <text x="24" y="135" font-size="17" fill="#486581">instruction + CoT</text>
    </g>
    <g transform="translate(292 424)">
      <rect width="205" height="158" rx="20" fill="#ffffff" stroke="#b8c9dd"/>
      <text x="24" y="35" font-size="16" font-weight="700" fill="#627d98">ERA 1 · 2022</text>
      <text x="24" y="73" font-size="23" font-weight="750" fill="#257a3e">ReAct Agent</text>
      <text x="24" y="108" font-size="17" fill="#486581">reason ↔ act</text>
      <text x="24" y="135" font-size="17" fill="#486581">tool + observation loop</text>
    </g>
    <g transform="translate(512 166)">
      <rect width="205" height="158" rx="20" fill="#ffffff" stroke="#b8c9dd"/>
      <text x="24" y="35" font-size="16" font-weight="700" fill="#627d98">ERA 2 · 2023</text>
      <text x="24" y="73" font-size="23" font-weight="750" fill="#8a5a00">Agent Framework</text>
      <text x="24" y="108" font-size="17" fill="#486581">components + graph</text>
      <text x="24" y="135" font-size="17" fill="#486581">rapid composition</text>
    </g>
    <g transform="translate(732 424)">
      <rect width="205" height="158" rx="20" fill="#ffffff" stroke="#b8c9dd"/>
      <text x="24" y="35" font-size="16" font-weight="700" fill="#627d98">ERA 3 · 2024–2025</text>
      <text x="24" y="73" font-size="23" font-weight="750" fill="#7650a8">Agent Runtime</text>
      <text x="24" y="108" font-size="17" fill="#486581">sandbox + state</text>
      <text x="24" y="135" font-size="17" fill="#486581">persistence + verify</text>
    </g>
    <g transform="translate(952 166)">
      <rect width="205" height="158" rx="20" fill="#ffffff" stroke="#b8c9dd"/>
      <text x="24" y="35" font-size="16" font-weight="700" fill="#627d98">ERA 4 · 2025–2026</text>
      <text x="24" y="73" font-size="23" font-weight="750" fill="#b24747">Persistent Agent</text>
      <text x="24" y="108" font-size="17" fill="#486581">skills + schedule</text>
      <text x="24" y="135" font-size="17" fill="#486581">long-term memory</text>
    </g>
    <g transform="translate(1172 424)">
      <rect width="205" height="158" rx="20" fill="#173f73" stroke="#173f73"/>
      <text x="24" y="35" font-size="16" font-weight="700" fill="#bcd2ec">ERA 5 · 2025–</text>
      <text x="24" y="73" font-size="23" font-weight="750" fill="#ffffff">Harness Engineering</text>
      <text x="24" y="108" font-size="17" fill="#d9e8ff">loop + context</text>
      <text x="24" y="135" font-size="17" fill="#d9e8ff">search + optimization</text>
    </g>
  </g>

  <g>
    <circle cx="174" cy="374" r="15" fill="#174f8a" stroke="#fff" stroke-width="6"/>
    <circle cx="394" cy="374" r="15" fill="#257a3e" stroke="#fff" stroke-width="6"/>
    <circle cx="614" cy="374" r="15" fill="#b17600" stroke="#fff" stroke-width="6"/>
    <circle cx="834" cy="374" r="15" fill="#7650a8" stroke="#fff" stroke-width="6"/>
    <circle cx="1054" cy="374" r="15" fill="#b24747" stroke="#fff" stroke-width="6"/>
    <circle cx="1274" cy="374" r="17" fill="#173f73" stroke="#fff" stroke-width="6"/>
    <line x1="174" y1="324" x2="174" y2="359" stroke="#174f8a" stroke-width="3"/>
    <line x1="394" y1="389" x2="394" y2="424" stroke="#257a3e" stroke-width="3"/>
    <line x1="614" y1="324" x2="614" y2="359" stroke="#b17600" stroke-width="3"/>
    <line x1="834" y1="389" x2="834" y2="424" stroke="#7650a8" stroke-width="3"/>
    <line x1="1054" y1="324" x2="1054" y2="359" stroke="#b24747" stroke-width="3"/>
    <line x1="1274" y1="391" x2="1274" y2="424" stroke="#173f73" stroke-width="3"/>
  </g>

  <g font-family="Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
    <rect x="72" y="646" width="1296" height="64" rx="18" fill="#ffffff" stroke="#bdcde0"/>
    <text x="104" y="686" font-size="19" font-weight="700" fill="#102a43">工程对象：</text>
    <text x="224" y="686" font-size="18" fill="#486581">wording</text>
    <text x="342" y="686" font-size="18" fill="#486581">→ interaction</text>
    <text x="495" y="686" font-size="18" fill="#486581">→ composition</text>
    <text x="660" y="686" font-size="18" fill="#486581">→ execution</text>
    <text x="803" y="686" font-size="18" fill="#486581">→ continuity</text>
    <text x="946" y="686" font-size="18" fill="#173f73" font-weight="750">→ system-level optimization</text>
  </g>
</svg>
